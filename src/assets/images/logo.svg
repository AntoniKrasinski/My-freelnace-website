<svg width="440" height="140" viewBox="0 0 440 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Roboto:wght@700;900&amp;display=swap');
      .mono { font-family: 'Rubik Mono One', 'Arial Black', sans-serif; }
      .sans { font-family: 'Roboto', Arial, sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- ICON: bold square with thick border, "AK" monogram, neobrutalist offset shadow -->
  <g>
    <!-- offset shadow block (thick-border look used across the site) -->
    <rect x="14" y="14" width="112" height="112" fill="#111111"/>
    <!-- main tile -->
    <rect x="8" y="8" width="112" height="112" fill="#F97B48" stroke="#111111" stroke-width="4"/>
    <text x="64" y="80" text-anchor="middle" class="mono" font-size="46" fill="#111111">AK</text>
    <!-- little "cursor" blip nodding to web/code -->
    <rect x="30" y="94" width="14" height="6" fill="#111111"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(150, 0)">
    <text x="0" y="66" class="sans" font-size="34" fill="#111111">ANTONI</text>
    <text x="0" y="102" class="mono" font-size="34" fill="#F97B48"><tspan fill="#111111">KRASIŃSKI</tspan>.pl</text>
    <!-- thin baseline rule echoing the site's theme-border blocks -->
    <rect x="0" y="112" width="284" height="4" fill="#111111"/>
  </g>
</svg>